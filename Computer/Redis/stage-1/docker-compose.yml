version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: redis-learning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # Enable AOF persistence so you can observe how data survives restarts
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  # Optional: a web-based Redis GUI for visual exploration
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  redis-insight-data:
